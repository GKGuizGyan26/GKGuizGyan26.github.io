<title>GK Quiz</title> <meta name="description" content="GK Quiz Gyan पर General Knowledge Questions, Quiz और Current Affairs उपलब्ध हैं.">
<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}
.box{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}
h2{text-align:center;}
.option{
display:block;
width:100%;
padding:10px;
margin:8px 0;
border:none;
background:#e9ecef;
border-radius:5px;
font-size:16px;
}
.info{
display:flex;
justify-content:space-between;

<body>

<div class="box">
<h2>GK Quiz</h2>

<div class="info">
<span>Score: <span id="score">0</span></span>
<span>Time: <span id="timer">15</span>s</span>
</div>

<h3 id="question"></h3>
<div id="options"></div>

<p id="result"></p>
<button onclick="nextQuestion()">Next</button>
</div>

<script>

const quiz=[
{q:"भारत की राजधानी क्या है?",o:["मुंबई","दिल्ली","चेन्नई","कोलकाता"],a:"दिल्ली"},
{q:"भारत का राष्ट्रीय पशु?",o:["शेर","बाघ","हाथी","घोड़ा"],a:"बाघ"},
{q:"भारत का राष्ट्रीय पक्षी?",o:["तोता","मोर","कबूतर","हंस"],a:"मोर"},
{q:"भारत का राष्ट्रीय फूल?",o:["गुलाब","कमल","चमेली","गेंदा"],a:"कमल"},
{q:"ताजमहल कहाँ है?",o:["दिल्ली","जयपुर","आगरा","लखनऊ"],a:"आगरा"},
{q:"भारत की मुद्रा?",o:["डॉलर","रुपया","पाउंड","येन"],a:"रुपया"},
{q:"भारत को आजादी कब मिली?",o:["1945","1946","1947","1948"],a:"1947"},
{q:"गणतंत्र दिवस?",o:["15 अगस्त","26 जनवरी","2 अक्टूबर","14 नवंबर"],a:"26 जनवरी"},
{q:"महात्मा गांधी का नाम?",o:["मोहनदास","राजेंद्र","नेहरू","पटेल"],a:"मोहनदास"},
{q:"भारत की सबसे लंबी नदी?",o:["यमुना","गंगा","नर्मदा","गोदावरी"],a:"गंगा"},

{q:"विश्व का सबसे बड़ा महासागर?",o:["हिंद","अटलांटिक","प्रशांत","आर्कटिक"],a:"प्रशांत"},
{q:"पृथ्वी का उपग्रह?",o:["सूर्य","मंगल","चंद्रमा","शुक्र"],a:"चंद्रमा"},
{q:"सूर्य कहाँ उगता है?",o:["पूर्व","पश्चिम","उत्तर","दक्षिण"],a:"पूर्व"},
{q:"पानी का सूत्र?",o:["CO2","H2O","O2","NaCl"],a:"H2O"},
{q:"हवा में सबसे अधिक गैस?",o:["ऑक्सीजन","नाइट्रोजन","हाइड्रोजन","CO2"],a:"नाइट्रोजन"},
{q:"मानव शरीर में हड्डियाँ?",o:["204","205","206","208"],a:"206"},
{q:"कंप्यूटर के जनक?",o:["गेट्स","चार्ल्स बैबेज","जॉब्स","मस्क"],a:"चार्ल्स बैबेज"},
{q:"ISRO मुख्यालय?",o:["दिल्ली","मुंबई","बेंगलुरु","चेन्नई"],a:"बेंगलुरु"},
{q:"चंद्रयान-3 किस देश का?",o:["भारत","अमेरिका","रूस","जापान"],a:"भारत"},
{q:"पहला भारतीय उपग्रह?",o:["रोहिणी","आर्यभट्ट","चंद्रयान","मंगलयान"],a:"आर्यभट्ट"},

{q:"राष्ट्रीय फल?",o:["सेब","आम","केला","अंगूर"],a:"आम"},
{q:"राष्ट्रीय वृक्ष?",o:["नीम","बरगद","पीपल","आम"],a:"बरगद"},
{q:"राष्ट्रीय गीत?",o:["जन गण मन","वंदे मातरम्","जय हिंद","सारे जहाँ"],a:"वंदे मातरम्"},
{q:"राष्ट्रीय गान किसने लिखा?",o:["प्रेमचंद","टैगोर","दिनकर","निराला"],a:"टैगोर"},
{q:"राष्ट्रीय जलीय जीव?",o:["व्हेल","डॉल्फिन","गंगा डॉल्फिन","शार्क"],a:"गंगा डॉल्फिन"},
{q:"राष्ट्रीय प्रतीक?",o:["कमल","अशोक स्तंभ","मोर","तिरंगा"],a:"अशोक स्तंभ"},
{q:"अशोक चक्र में तीलियाँ?",o:["22","24","26","28"],a:"24"},
{q:"विश्व का सबसे बड़ा देश?",o:["भारत","अमेरिका","रूस","चीन"],a:"रूस"},
{q:"विश्व का सबसे ऊँचा पर्वत?",o:["K2","एवरेस्ट","नंदा देवी","कंचनजंगा"],a:"एवरेस्ट"},
{q:"भारत का सबसे बड़ा राज्य?",o:["UP","MP","राजस्थान","बिहार"],a:"राजस्थान"},

{q:"भारत का सबसे छोटा राज्य?",o:["गोवा","सिक्किम","त्रिपुरा","मणिपुर"],a:"गोवा"},
{q:"लाल किला कहाँ?",o:["आगरा","दिल्ली","जयपुर","भोपाल"],a:"दिल्ली"},
{q:"कुतुब मीनार कहाँ?",o:["दिल्ली","मुंबई","आगरा","जयपुर"],a:"दिल्ली"},
{q:"बाल दिवस?",o:["5 सितम्बर","14 नवम्बर","26 जनवरी","15 अगस्त"],a:"14 नवम्बर"},
{q:"शिक्षक दिवस?",o:["5 सितम्बर","14 नवम्बर","26 जनवरी","2 अक्टूबर"],a:"5 सितम्बर"},
{q:"पर्यावरण दिवस?",o:["5 जून","6 जून","7 जून","8 जून"],a:"5 जून"},
{q:"पहली महिला प्रधानमंत्री?",o:["इंदिरा गांधी","प्रतिभा","सोनिया","सरोजिनी"],a:"इंदिरा गांधी"},
{q:"प्रथम राष्ट्रपति?",o:["नेहरू","राजेंद्र प्रसाद","पटेल","कलाम"],a:"राजेंद्र प्रसाद"},
{q:"जय जवान जय किसान?",o:["गांधी","नेहरू","शास्त्री","पटेल"],a:"शास्त्री"},
{q:"राष्ट्रीय नदी?",o:["यमुना","गंगा","नर्मदा","गोदावरी"],a:"गंगा"},

{q:"राष्ट्रीय आदर्श वाक्य?",o:["जय हिंद","सत्यमेव जयते","वंदे मातरम्","भारत माता"],a:"सत्यमेव जयते"},
{q:"संविधान दिवस?",o:["26 जनवरी","26 नवम्बर","15 अगस्त","2 अक्टूबर"],a:"26 नवम्बर"},
{q:"राष्ट्रीय खेल?",o:["क्रिकेट","हॉकी","कबड्डी","फुटबॉल"],a:"हॉकी"},
{q:"पृथ्वी को नीला ग्रह क्यों?",o:["जल","पेड़","आकाश","बादल"],a:"जल"},
{q:"भारत का राष्ट्रीय ध्वज कितने रंगों का?",o:["2","3","4","5"],a:"3"},
{q:"भारत का राष्ट्रीय कैलेंडर?",o:["विक्रम","शक","हिजरी","ग्रेगोरियन"],a:"शक"},
{q:"सूर्य एक?",o:["ग्रह","तारा","उपग्रह","धूमकेतु"],a:"तारा"},
{q:"चंद्रमा एक?",o:["तारा","ग्रह","उपग्रह","आकाशगंगा"],a:"उपग्रह"},
{q:"भारत में कुल राज्य?",o:["28","29","30","31"],a:"28"},
{q:"भारत का राष्ट्रीय पशु?",o:["शेर","बाघ","हाथी","गैंडा"],a:"बाघ"}
];

let current=0;
let score=0;
let time=15;
let timer;

function loadQuestion(){
document.getElementById("question").innerText=(current+1)+". "+quiz[current].q;

let html="";
quiz[current].o.forEach(op=>{
html+=`<button class="option" onclick="checkAns('${op}')">${op}</button>`;
});
document.getElementById("options").innerHTML=html;

startTimer();
}

function checkAns(ans){
clearInterval(timer);

if(ans===quiz[current].a){
score++;
document.getElementById("score").innerText=score;
}

nextQuestion();
}

function startTimer(){
time=30;
document.getElementById("timer").innerText=time;

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText=time;

if(time<=0){
clearInterval(timer);
nextQuestion();
}
},1000);
}

function nextQuestion(){
current++;

if(current>=quiz.length){
document.querySelector(".box").innerHTML=
`<h2>Quiz Finished</h2>
<h3>Your Score: ${score}/50</h3>`;
return;
}

loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
